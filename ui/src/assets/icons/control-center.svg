      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ctrlRightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
